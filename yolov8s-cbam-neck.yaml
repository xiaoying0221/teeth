# YOLOv8s + CBAM 注意力机制（Neck）
# 在 Neck 中第一次特征融合后的 C2f 输出后插入一个 CBAM 模块
# 位置：P5 上采样后与 Backbone P4 融合，再经 C2f 后进行注意力筛选

nc: 1  # 类别数
scales:
  # [depth, width, max_channels]
  s: [0.33, 0.50, 1024]

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]       # 0 - P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1 - P2/4
  - [-1, 3, C2f, [128, True]]       # 2
  - [-1, 1, Conv, [256, 3, 2]]      # 3 - P3/8
  - [-1, 6, C2f, [256, True]]       # 4 - P3
  - [-1, 1, Conv, [512, 3, 2]]      # 5 - P4/16
  - [-1, 6, C2f, [512, True]]       # 6 - P4
  - [-1, 1, Conv, [1024, 3, 2]]     # 7 - P5/32
  - [-1, 3, C2f, [1024, True]]      # 8 - P5
  - [-1, 1, SPPF, [1024, 5]]        # 9

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 6], 1, Concat, [1]]                    # 11 - cat backbone P4
  - [-1, 3, C2f, [512]]                          # 12 - first neck fusion
  - [-1, 1, CBAM, []]                            # 13 - CBAM on neck fused P4 feature

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 4], 1, Concat, [1]]                    # 15 - cat backbone P3
  - [-1, 3, C2f, [256]]                          # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                  # 17
  - [[-1, 13], 1, Concat, [1]]                  # 18 - cat neck P4 (after CBAM)
  - [-1, 3, C2f, [512]]                         # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                  # 20
  - [[-1, 9], 1, Concat, [1]]                   # 21 - cat head P5 (SPPF layer 9)
  - [-1, 3, C2f, [1024]]                        # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]]             # 23 - Detect(P3, P4, P5)
