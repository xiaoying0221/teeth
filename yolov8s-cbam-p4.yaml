# YOLOv8s + CBAM 注意力机制（仅 P4）
# 仅在 Backbone 的 P4 输出后插入一个 CBAM 模块
# 用于验证“中层语义特征增强”是否比 P3/P4/P5 全部插入更有效

nc: 1  # 类别数
scales:
  # [depth, width, max_channels]
  s: [0.33, 0.50, 1024]

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]       # 0 - P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1 - P2/4
  - [-1, 3, C2f, [128, True]]       # 2
  - [-1, 1, Conv, [256, 3, 2]]      # 3 - P3/8
  - [-1, 6, C2f, [256, True]]       # 4 - P3
  - [-1, 1, Conv, [512, 3, 2]]      # 5 - P4/16
  - [-1, 6, C2f, [512, True]]       # 6
  - [-1, 1, CBAM, []]               # 7 - CBAM on P4 (ch=256 after width scale)
  - [-1, 1, Conv, [1024, 3, 2]]     # 8 - P5/32
  - [-1, 3, C2f, [1024, True]]      # 9 - P5
  - [-1, 1, SPPF, [1024, 5]]        # 10

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 7], 1, Concat, [1]]                    # 12 - cat backbone P4 (layer 7, after CBAM)
  - [-1, 3, C2f, [512]]                          # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 4], 1, Concat, [1]]                    # 15 - cat backbone P3 (layer 4, no CBAM)
  - [-1, 3, C2f, [256]]                          # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                  # 17
  - [[-1, 13], 1, Concat, [1]]                  # 18 - cat head P4
  - [-1, 3, C2f, [512]]                         # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                  # 20
  - [[-1, 10], 1, Concat, [1]]                  # 21 - cat head P5 (SPPF layer 10)
  - [-1, 3, C2f, [1024]]                        # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]]             # 23 - Detect(P3, P4, P5)
