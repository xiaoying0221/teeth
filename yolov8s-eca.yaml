# YOLOv8s + ECA 注意力机制
# 在 Backbone 的 P3/P4/P5 输出后各插入一个 ECA 模块
# ECA 为轻量通道注意力模块，适合小数据集和单类别检测任务

nc: 1  # 类别数
scales:
  # [depth, width, max_channels]
  s: [0.33, 0.50, 1024]

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]       # 0 - P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1 - P2/4
  - [-1, 3, C2f, [128, True]]       # 2
  - [-1, 1, Conv, [256, 3, 2]]      # 3 - P3/8
  - [-1, 6, C2f, [256, True]]       # 4
  - [-1, 1, ECA, []]                # 5 - ECA on P3 (ch=128 after width scale)
  - [-1, 1, Conv, [512, 3, 2]]      # 6 - P4/16
  - [-1, 6, C2f, [512, True]]       # 7
  - [-1, 1, ECA, []]                # 8 - ECA on P4 (ch=256 after width scale)
  - [-1, 1, Conv, [1024, 3, 2]]     # 9 - P5/32
  - [-1, 3, C2f, [1024, True]]      # 10      不啵啵啵啵啵啵啵啵啵啵啵啵啵啵啵啵啵啵                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
  - [-1, 1, ECA, []]                # 11 - ECA on P5 (ch=512 after width scale)
  - [-1, 1, SPPF, [1024, 5]]        # 12

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 8], 1, Concat, [1]]                    # 14 - cat backbone P4 (layer 8, after ECA)
  - [-1, 3, C2f, [512]]                          # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 16
  - [[-1, 5], 1, Concat, [1]]                    # 17 - cat backbone P3 (layer 5, after ECA)
  - [-1, 3, C2f, [256]]                          # 18 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                  # 19
  - [[-1, 15], 1, Concat, [1]]                  # 20 - cat head P4
  - [-1, 3, C2f, [512]]                         # 21 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                  # 22
  - [[-1, 12], 1, Concat, [1]]                  # 23 - cat head P5 (SPPF layer 12)
  - [-1, 3, C2f, [1024]]                        # 24 (P5/32-large)

  - [[18, 21, 24], 1, Detect, [nc]]             # 25 - Detect(P3, P4, P5)
